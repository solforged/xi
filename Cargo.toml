[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
xi-kernel = { path = "crates/xi-kernel" }
xi-policy = { path = "crates/xi-policy" }
xi-protocol = { path = "crates/xi-protocol" }
xi-provider = { path = "crates/xi-provider" }
xi-sandbox = { path = "crates/xi-sandbox" }
xi-session = { path = "crates/xi-session" }
xi-tools = { path = "crates/xi-tools" }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
landlock = "0.4.7"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "mount", "process", "sched", "signal", "user"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
rustyline = "19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
wiremock = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
