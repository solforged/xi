# Base standard-tier pricing, researched 2026-10-26. No network discovery.
# https://platform.claude.com/docs/en/models/overview
# https://platform.claude.com/docs/en/about-claude/pricing
# https://developers.openai.com/api/docs/models/gpt-5.5
# https://developers.openai.com/api/docs/models/gpt-5.4
# https://developers.openai.com/api/docs/models/gpt-5.4-mini
# Cache writes use the Anthropic five-minute rate. OpenAI has no separate charge.
# Long-context premiums and regional surcharges are not represented.
#
# `reasoning` lists the levels each model accepts, from the provider's own
# per-model documentation; `off` only where reasoning can be turned off.
# https://platform.claude.com/docs/en/build-with-claude/effort
# https://developers.openai.com/api/docs/guides/reasoning

[provider.anthropic]
api = "anthropic-messages"
base_url = "https://api.anthropic.com"
auth = { env = "ANTHROPIC_API_KEY" }

# A Claude subscription through Claude Code's OAuth client (`xi login anthropic`).
# Opt in by selecting claude/…; anthropic/… continues using an API key.
# This unsupported third-party flow may be blocked by Anthropic without notice.
[provider.claude]
api = "anthropic-messages"
base_url = "https://api.anthropic.com"
auth = { login = "anthropic" }

[provider.openai]
api = "openai-chat"
base_url = "https://api.openai.com/v1"
auth = { env = "OPENAI_API_KEY" }

# A ChatGPT plan through the Codex backend (`xi login chatgpt`). Usage counts
# against the plan's limits, so these models carry no per-token pricing.
# The backend takes no output limit and keys its prompt cache by session.
# Its current models all need Responses Lite and can't turn reasoning off.
# Context windows and reasoning levels are the account's `/models` values,
# less `ultra`: Codex sends it as `max` or `xhigh` plus a proactive
# multi-agent prompt, and the backend rejects it as an effort.
# https://github.com/openai/codex/blob/main/codex-rs/models-manager/models.json
[provider.chatgpt]
api = "openai-responses"
base_url = "https://chatgpt.com/backend-api/codex"
auth = { login = "chatgpt" }
compat = { output_limit = false, session_header = "session-id" }

# Opus 5.5 always thinks: `thinking: disabled` fails at every effort.
[[model]]
provider = "anthropic"
id = "claude-opus-5-5"
context_window = 1000000
max_output = 128000
reasoning = ["low", "medium", "high", "xhigh", "max"]
pricing = { input = 4, output = 20, cache_read = 0.20, cache_write = 5 }

# Off sends `thinking: between_tools`, its lowest setting.
[[model]]
provider = "anthropic"
id = "claude-sonnet-5-5"
context_window = 1000000
max_output = 128000
reasoning = ["off", "low", "medium", "high", "xhigh", "max"]
pricing = { input = 2, output = 10, cache_read = 0.10, cache_write = 2.50 }

[[model]]
provider = "anthropic"
id = "claude-fable-5-1"
context_window = 1000000
max_output = 128000
reasoning = ["low", "medium", "high", "xhigh", "max"]
pricing = { input = 10, output = 50, cache_read = 0.25, cache_write = 12.50 }

# Sonnet 4.6 has `max` but no `xhigh`.
[[model]]
provider = "anthropic"
id = "claude-sonnet-4-6"
context_window = 1000000
max_output = 128000
reasoning = ["off", "low", "medium", "high", "max"]
pricing = { input = 3, output = 15, cache_read = 0.30, cache_write = 3.75 }

# Subscription usage counts against the plan, not the API's token prices.
# Native 1M models need no long-context beta. Sonnet 4.6 keeps its standard
# window: the beta-gated 1M extension requires usage credits on subscriptions.
[[model]]
provider = "claude"
id = "claude-opus-5-5"
context_window = 1000000
max_output = 64000
reasoning = ["low", "medium", "high", "xhigh", "max"]

[[model]]
