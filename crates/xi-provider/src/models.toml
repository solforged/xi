# Base standard-tier pricing, researched 2026-10-26. No network discovery.
# https://platform.claude.com/docs/en/models/overview
# https://platform.claude.com/docs/en/about-claude/pricing
# https://developers.openai.com/api/docs/models/gpt-5.5
# https://developers.openai.com/api/docs/models/gpt-5.4
# https://developers.openai.com/api/docs/models/gpt-5.4-mini
# Cache writes use the Anthropic five-minute rate. OpenAI has no separate charge.
# Long-context premiums and regional surcharges are not represented.

[provider.anthropic]
api = "anthropic-messages"
base_url = "https://api.anthropic.com"
auth = { env = "ANTHROPIC_API_KEY" }

[provider.openai]
api = "openai-chat"
base_url = "https://api.openai.com/v1"
auth = { env = "OPENAI_API_KEY" }

[[model]]
provider = "anthropic"
id = "claude-opus-5-5"
context_window = 1000000
max_output = 128000
reasoning = true
pricing = { input = 4, output = 20, cache_read = 0.20, cache_write = 5 }

[[model]]
provider = "anthropic"
id = "claude-sonnet-5-5"
context_window = 1000000
max_output = 128000
reasoning = true
pricing = { input = 2, output = 10, cache_read = 0.10, cache_write = 2.50 }

[[model]]
provider = "anthropic"
id = "claude-fable-5-1"
context_window = 1000000
max_output = 128000
reasoning = true
pricing = { input = 10, output = 50, cache_read = 0.25, cache_write = 12.50 }

[[model]]
provider = "anthropic"
id = "claude-sonnet-4-6"
context_window = 1000000
max_output = 128000
reasoning = true
pricing = { input = 3, output = 15, cache_read = 0.30, cache_write = 3.75 }

[[model]]
provider = "openai"
id = "gpt-5.5"
context_window = 1050000
max_output = 128000
reasoning = true
pricing = { input = 5, output = 30, cache_read = 0.50 }

[[model]]
provider = "openai"
id = "gpt-5.4"
context_window = 1050000
max_output = 128000
reasoning = true
pricing = { input = 2.50, output = 15, cache_read = 0.25 }

[[model]]
provider = "openai"
id = "gpt-5.4-mini"
context_window = 400000
max_output = 128000
reasoning = true
pricing = { input = 0.75, output = 4.50, cache_read = 0.075 }
