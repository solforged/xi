[package]
name = "xi-sandbox"
description = "Runs xi tool processes inside an OS sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xi-sandbox-exec"
path = "src/bin/xi-sandbox-exec.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace forbids unsafe code; this crate needs one ioctl, so it denies
# unsafe code and allows it on that function only.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
