[[arm]]
name = "xi"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

[[arm]]
name = "xi-hashline"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--tools", "read,hashline,write,bash,search", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

[[arm]]
name = "omp"
kind = "omp"
argv = ["omp", "-p", "--mode", "json", "--model", "{model}", "--thinking", "medium", "--no-extensions", "--no-skills", "--no-rules", "--no-title", "--approval-mode", "yolo", "--config", "{session_dir}/omp.yml", "--session-dir", "{session_dir}", "{prompt}"]
[arm.env]

[[arm]]
name = "pi"
kind = "pi"
argv = ["pi", "-p", "--mode", "json", "--model", "{model}", "--thinking", "medium", "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files", "--no-mcp", "--offline", "--session-dir", "{session_dir}", "{prompt}"]
[arm.env]

[[arm]]
name = "xi-compact"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--config", "{arms_dir}/configs/compact.toml", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

[[arm]]
name = "xi-subagents"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--tools", "read,edit,write,bash,search,task", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

# Measures the task tool when it is used: the prompt asks for delegation.
[[arm]]
name = "xi-delegate"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--tools", "read,edit,write,bash,search,task", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}\n\nUse the task tool to work on independent parts in parallel."]
[arm.env]

# Web arms. `--on-ask allow` answers every ask, so `xi-net` reaches the web
# only through bash (curl, git); the web arms add the opt-in tools.
[[arm]]
name = "xi-net"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "allow", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

[[arm]]
name = "xi-web"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "allow", "--tools", "read,edit,write,bash,search,web_search,fetch", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

# Needs XI_BENCH_EXA_API_KEY in the environment.
[[arm]]
name = "xi-web-exa"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "allow", "--config", "{arms_dir}/configs/web-exa.toml", "--tools", "read,edit,write,bash,search,web_search,fetch", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]
