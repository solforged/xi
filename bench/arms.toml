[[arm]]
name = "xi"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

[[arm]]
name = "xi-replace"
kind = "xi"
argv = ["xi", "--json", "--on-ask", "deny", "--tools", "read,replace,write,bash,search", "--model", "{model}", "--session-dir", "{session_dir}", "--cwd", "{workspace}", "-p", "{prompt}"]
[arm.env]

[[arm]]
name = "omp"
kind = "omp"
argv = ["omp", "-p", "--mode", "json", "--model", "{model}", "--thinking", "medium", "--no-extensions", "--no-skills", "--no-rules", "--no-title", "--approval-mode", "yolo", "--config", "{session_dir}/omp.yml", "--session-dir", "{session_dir}", "{prompt}"]
[arm.env]

[[arm]]
name = "pi"
kind = "pi"
argv = ["pi", "-p", "--mode", "json", "--model", "{model}", "--thinking", "medium", "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files", "--no-mcp", "--offline", "--session-dir", "{session_dir}", "{prompt}"]
[arm.env]
