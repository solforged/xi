prompt = "Reconcile the full active service catalog in SPEC.md. All 16 charters and 16 revision memoranda are required: 256 independent policies have facts spread across their charter and two ordered revisions. Populate catalog.json and repair rules.policy, including isolation and fresh return values. Read the normative prose rather than guessing from test digests. Run python3 -m unittest discover -s tests. Do not edit tests, charters, revisions, SPEC.md or .gitignore."
check = ["python3", "-m", "unittest", "discover", "-s", "tests"]
timeout_seconds = 1800
protected_paths = ["tests", "charters", "revisions", "SPEC.md", ".gitignore"]
tags = ["python", "long-context", "spec-reconciliation"]
