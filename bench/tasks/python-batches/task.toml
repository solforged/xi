prompt = "Fix the batching and weighted-measurement library. Preserve iterable inputs, reject invalid sizes and weights, and handle partial batches and zero weights correctly. Run python3 -m unittest discover -s tests. Do not modify tests or .gitignore."
check = ["python3", "-m", "unittest", "discover", "-s", "tests"]
timeout_seconds = 300
protected_paths = ["tests", ".gitignore"]
tags = ["python", "multi-bug"]
