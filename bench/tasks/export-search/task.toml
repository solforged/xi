prompt = "The export service's archived-only mode returns live documents and mishandles deleted archives. Find the dispatch path and the filtering rule across the policy modules. Archived-only must select archived, nondeleted documents; all other modes must retain their existing behavior. Run python3 -m unittest discover -s tests. Do not modify tests or .gitignore."
check = ["python3", "-m", "unittest", "discover", "-s", "tests"]
timeout_seconds = 300
protected_paths = ["tests", ".gitignore"]
tags = ["python", "search"]
